name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build test host
        run: |
          xcodebuild \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Debug" \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build-for-testing

      - name: Verify isolated test host identity
        run: python3 scripts/verify-build-identity.py build-tests/Build/Products/Debug/Onglai.app --configuration Debug

      - name: Test
        run: |
          xcodebuild \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Debug" \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            test-without-building

      # Compile-and-link check only. Code signing is skipped because the app
      # group entitlement is team-restricted and CI has no signing identity;
      # signed, notarizable builds still come from scripts/release.sh.
      - name: Build
        run: |
          xcodebuild \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Release" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Verify release identity
        run: python3 scripts/verify-build-identity.py build/Build/Products/Release/Onglai.app --configuration Release
